# v3 extended ladder — L2 (two tools) / instance b (Warszawa).
# get_weather then get_forecast(days=4); the mean over day 2 / day 4 and the
# C->F conversion both stay on the model side. Scaffolding load rises, the
# arithmetic does not change.
# Identical golden (48.2 F) to v3_ext_L0_b / L1_b / L2_b / L3N_b / L3T_b — only scaffolding load differs.
# Tool block byte-identical to v3_chain_001 (constant schema across rungs).
id: v3_ext_L2_b
category: STATEFUL
environment: weather
language_variant: PL_EN
prompt: "Sprawdź pogodę w Warszawie. Następnie pobierz prognozę dla Warszawy na cztery dni i podaj średnią temperaturę z drugiego i czwartego dnia w °F."
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
expected_final_state:
  tools_called_in_order_strict:
    - {tool: get_weather, args: {city: "Warszawa"}}
    - {tool: get_forecast, args: {city: "Warszawa", days: 4}}
  final_answer_contains_any: ["48.2", "48,2"]
  final_answer_used: true
max_steps: 8
constraints:
  - "Normalise the inflected city name: 'w Warszawie' / 'dla Warszawy' to nominative 'Warszawa'."
  - "Normalise the Polish numeral: 'cztery' to 4."
  - "Average the 2nd and 4th day; mean and C->F conversion are computed by the model itself."
  - "Golden is rounding-robust: the day2/day4 mean is exact (9 C), so any 1-dp rounding yields the same 48.2 F."
