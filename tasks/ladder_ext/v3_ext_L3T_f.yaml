# v3 extended ladder — L3T (full 4-tool chain, ORDER TRAP) / instance f (Łódź->Częstochowa).
# get_weather -> find_nearest_city (trap: Łódź r=120 returns [Częstochowa 120, Płock 100] in graph
# order, so Częstochowa is FIRST though Płock at 100 km is nearer) ->
# get_forecast(Częstochowa, 4) -> mean(day2, day4) -> convert_temperature.
# Golden: mean(7, 8) = 7.5 C -> 45.5 F.
# Identical golden (45.5 F) to v3_ext_L0_f / L1_f / L2_f / L3N_f / L3T_f — only scaffolding load differs.
# Tool block byte-identical to v3_chain_001 (constant schema across rungs).
id: v3_ext_L3T_f
category: STATEFUL
environment: weather
language_variant: PL_EN
prompt: "Sprawdź pogodę w Łodzi. Następnie znajdź miasta w promieniu stu dwudziestu kilometrów od Łodzi i dla pierwszego miasta z otrzymanej listy pobierz prognozę na cztery dni. Na koniec podaj średnią temperaturę z drugiego i czwartego dnia tej prognozy w stopniach Fahrenheita."
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
expected_final_state:
  tools_called_in_order_strict:
    - {tool: get_weather, args: {city: "Łódź"}}
    - {tool: find_nearest_city, args: {reference_city: "Łódź", max_distance_km: 120}}
    - {tool: get_forecast, args: {city: "Częstochowa", days: 4}}
    - {tool: convert_temperature, args: {from_unit: "celsius", to_unit: "fahrenheit"}}
  final_answer_contains_any: ["45.5", "45,5"]
  final_answer_used: true
max_steps: 8
constraints:
  - "Normalise Polish numerals: 'stu dwudziestu' to 120, 'cztery' to 4."
  - "Use the FIRST city returned by find_nearest_city, not the nearest by distance."
  - "Average the 2nd and 4th day of the forecast; golden is rounding-robust (mean is exactly 7.5 C)."
  - "Golden is rounding-robust: the day2/day4 mean is exact (7.5 C), so any 1-dp rounding yields the same 45.5 F."
