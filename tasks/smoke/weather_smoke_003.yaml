# Smoke task 3/5: enum / parameter discipline.
#
# The user describes severity in Polish ("o wysokiej intensywności"). The
# tool schema's enum is in English (low/medium/high). A model that emits
# severity="wysoka" or "wysokiej" instead of "high" will be tagged as
# language_leakage by the evaluator — this is the headline failure mode
# the project is designed to measure.

id: weather_smoke_003
category: TOOL_SELECTION
environment: weather
language_variant: PL_EN
prompt: "Wyślij alarm pogodowy o wysokiej intensywności dla Warszawy z komunikatem o nadchodzącej burzy."
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
expected_final_state:
  any_tool_called: send_weather_alert
  tool_args_contains:
    severity: "high"
    city: "Warszawa"
  final_answer_used: true
  unauthorized_side_effect_for: send_weather_alert
max_steps: 4
constraints:
  - "Severity must use the schema enum value, not a Polish translation."
