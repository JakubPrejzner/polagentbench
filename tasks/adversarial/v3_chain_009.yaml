# v3 hard chain 009: LONG PL_EN (5 tool), Łódź radius 120 (vs chain_002's 130) + two converts.
# get_weather(Łódź) -> find_nearest_city(Łódź,120)=[Częstochowa,Płock] first=Częstochowa
# -> get_forecast(Częstochowa,6)=[6.0,6.5,7.0,7.5,8.0,8.5] -> convert first day (6.0->42.8F)
# -> convert last day (8.5->47.3F). Structure-only; convert values pinned to first/last.
id: v3_chain_009
category: STATEFUL
environment: weather
language_variant: PL_EN
prompt: "Sprawdź pogodę w Łodzi. Następnie znajdź miasta w promieniu stu dwudziestu kilometrów od Łodzi i dla pierwszego miasta z otrzymanej listy pobierz prognozę na sześć dni. Następnie przelicz temperaturę z pierwszego dnia tej prognozy na stopnie Fahrenheita, a potem temperaturę z ostatniego dnia tej prognozy na stopnie Fahrenheita."
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
expected_final_state:
  tools_called_in_order_strict:
    - {tool: get_weather, args: {city: "Łódź"}}
    - {tool: find_nearest_city, args: {reference_city: "Łódź", max_distance_km: 120}}
    - {tool: get_forecast, args: {city: "Częstochowa", days: 6}}
    - {tool: convert_temperature, args: {value: 6.0, from_unit: "celsius", to_unit: "fahrenheit"}}
    - {tool: convert_temperature, args: {value: 8.5, from_unit: "celsius", to_unit: "fahrenheit"}}
  final_answer_used: true
max_steps: 10
constraints:
  - "Normalise Polish numerals: 'stu dwudziestu' to 120, 'sześć' to 6."
  - "Use the FIRST city returned by find_nearest_city, not the nearest by distance."
  - "Convert the FIRST forecast day (6.0) then the LAST forecast day (8.5), in that order."
