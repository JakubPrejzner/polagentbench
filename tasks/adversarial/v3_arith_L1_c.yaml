# v3 arith ladder — L1 (one tool) / instance c (Kraków).
# One get_forecast(days=4) call returns the four numbers L0_c states verbatim
# ([6.5,7.0,7.5,8.0]); the model selects day 2 and day 4, means them and does
# C->F itself. Rounding-robust day2/day4 redesign (see L0_c header).
# Golden: mean(day2=7.0, day4=8.0) = 7.5 C -> 45.5 F. Identical to L0_c/L2_c/L3_c.
# Tool block byte-identical to v3_chain_001 (constant schema across rungs).
id: v3_arith_L1_c
category: STATEFUL
environment: weather
language_variant: PL_EN
prompt: "Pobierz prognozę dla Krakowa na 4 dni i podaj średnią temperaturę z drugiego i czwartego dnia w °F."
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
expected_final_state:
  tools_called_in_order_strict:
    - {tool: get_forecast, args: {city: "Kraków", days: 4}}
  final_answer_contains_any: ["45.5", "45,5"]
  final_answer_used: true
max_steps: 8
constraints:
  - "Normalise the inflected city name: 'dla Krakowa' to nominative 'Kraków'."
  - "Average the 2nd and 4th day of the 4-day forecast; mean and C->F conversion are computed by the model itself."
  - "Golden is rounding-robust: the day2/day4 mean is exact (7.5 C), so any 1-dp rounding yields the same 45.5 F."
