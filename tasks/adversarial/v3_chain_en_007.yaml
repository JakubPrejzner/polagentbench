# v3 hard chain EN 007: LONG EN_EN (5 tool), no graph. Rome forecast min/max + Athens.
# get_weather(Rome) -> get_forecast(Rome,6)=[16.5,17.0,17.5,18.0,18.5,19.0]
# -> convert min (16.5->61.7F) -> convert max (19.0->66.2F) -> get_weather(Athens).
id: v3_chain_en_007
category: STATEFUL
environment: weather
language_variant: EN_EN
prompt: "Check the weather in Rome, then get the forecast for the next six days. Convert the lowest forecast temperature to Fahrenheit, then convert the highest forecast temperature to Fahrenheit. Finally, check the weather in Athens for comparison."
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
expected_final_state:
  tools_called_in_order_strict:
    - {tool: get_weather, args: {city: "Rome"}}
    - {tool: get_forecast, args: {city: "Rome", days: 6}}
    - {tool: convert_temperature, args: {value: 16.5, from_unit: "celsius", to_unit: "fahrenheit"}}
    - {tool: convert_temperature, args: {value: 19.0, from_unit: "celsius", to_unit: "fahrenheit"}}
    - {tool: get_weather, args: {city: "Athens"}}
  final_answer_used: true
max_steps: 10
constraints:
  - "Convert the LOWEST forecast temperature (16.5) then the HIGHEST (19.0), in that order."
