# Adversarial 2/10: LANGUAGE_LEAKAGE on temperature unit enums.
#
# The Polish prompt uses "Fahrenheita" (genitive case). The convert_temperature
# schema enum requires literal lowercase English "celsius" / "fahrenheit".
# Common failure: the model emits to_unit="Fahrenheita" / "Fahrenheit" /
# "fahrenheita". Two-step task: get_weather, then convert_temperature on the
# returned temperature value.

id: adv_002
category: TOOL_SELECTION
environment: weather
language_variant: PL_EN
prompt: "Sprawdź pogodę w Gdańsku, a potem przelicz tę temperaturę na stopnie Fahrenheita."
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
expected_final_state:
  ordered_tools: [get_weather, convert_temperature]
  tool_args_exact:
    get_weather: {city: "Gdańsk"}
    convert_temperature: {from_unit: "celsius", to_unit: "fahrenheit"}
  final_answer_used: true
max_steps: 5
constraints:
  - "Temperature unit values must be lowercase English enum literals."
