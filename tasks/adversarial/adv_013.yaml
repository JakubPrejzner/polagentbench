# Adversarial 13/13: three-tool ordered chain with numeral normalisation.
#
# Mid-difficulty composite: the model must (a) call get_weather for
# Gdańsk, (b) call find_nearest_city with max_distance_km=50 (Polish
# numeral "pięćdziesięciu" → 50), (c) call get_forecast with days=3
# (Polish "trzy" → 3) for a city derived from the previous tool result.
# tools_called_in_order_strict enforces the exact sequence; the
# get_forecast city is not pinned because the right answer depends on
# the find_nearest_city output.

id: adv_013
category: STATEFUL
environment: weather
language_variant: PL_EN
prompt: "Sprawdź pogodę w Gdańsku, znajdź najbliższe miasta w promieniu pięćdziesięciu kilometrów, a następnie pokaż prognozę dla pierwszego z tych miast na trzy dni."
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
expected_final_state:
  tools_called_in_order_strict:
    - {tool: get_weather, args: {city: "Gdańsk"}}
    - {tool: find_nearest_city, args: {reference_city: "Gdańsk", max_distance_km: 50}}
    - {tool: get_forecast, args: {days: 3}}
  final_answer_used: true
max_steps: 6
constraints:
  - "Normalise Polish numerals 'pięćdziesięciu' to 50 and 'trzy' to 3."
  - "Call the three tools in the exact order specified by the prompt."
