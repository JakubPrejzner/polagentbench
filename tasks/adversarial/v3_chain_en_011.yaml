# v3 hard chain EN 011: LONG EN_EN 5-tool, NO find_nearest_city (graph is PL-only).
# weather Athens(19.0) -> forecast Athens 5 [17.8,18.2,18.8,19.2,19.8]
# -> convert(min=17.8C->64.04F) -> convert(max=19.8C->67.64F) -> weather Tokyo. Structure-only.
id: v3_chain_en_011
category: STATEFUL
environment: weather
language_variant: EN_EN
prompt: "Check the weather in Athens, then get the five-day forecast for Athens. Convert the lowest temperature in that forecast to degrees Fahrenheit, then convert the highest temperature in that forecast to degrees Fahrenheit. Finally, check the weather in Tokyo."
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
expected_final_state:
  tools_called_in_order_strict:
    - {tool: get_weather, args: {city: "Athens"}}
    - {tool: get_forecast, args: {city: "Athens", days: 5}}
    - {tool: convert_temperature, args: {from_unit: "celsius", to_unit: "fahrenheit"}}
    - {tool: convert_temperature, args: {from_unit: "celsius", to_unit: "fahrenheit"}}
    - {tool: get_weather, args: {city: "Tokyo"}}
  final_answer_used: true
max_steps: 10
constraints:
  - "Convert the MINIMUM then the MAXIMUM forecast temperature, in that order, before checking Tokyo."
