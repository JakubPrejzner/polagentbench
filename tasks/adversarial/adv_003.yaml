# Adversarial 3/10: INFLECTION_MISMATCH on Polish locative case.
#
# The Polish prompt uses the locative form "Łodzi" — the city's canonical
# (nominative) name in the env DB is "Łódź". Without strict_match the env
# would silently fold "Łodzi" -> "Łódź"; we want the failure mode to surface
# instead, so strict_match=true forces exact-match resolution. The model
# must un-decline the city name.

id: adv_003
category: TOOL_SELECTION
environment: weather
language_variant: PL_EN
prompt: "Jaka jest pogoda w Łodzi?"
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
strict_match: true
expected_final_state:
  any_tool_called: get_weather
  tool_args_exact:
    get_weather: {city: "Łódź"}
  all_tool_calls_succeeded: true
  final_answer_used: true
max_steps: 5
constraints:
  - "City must be passed in nominative case with full diacritics."
