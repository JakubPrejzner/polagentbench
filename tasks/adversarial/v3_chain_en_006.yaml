# v3 hard chain EN 006: LONG EN_EN (5 tool), no graph. Berlin forecast min/max convert + Paris.
# get_weather(Berlin) -> get_forecast(Berlin,5)=[8.8,9.2,9.8,10.2,10.8]
# -> convert min (8.8->47.84F) -> convert max (10.8->51.44F) -> get_weather(Paris).
# Structure-only; convert values pinned to min/max.
id: v3_chain_en_006
category: STATEFUL
environment: weather
language_variant: EN_EN
prompt: "Check the weather in Berlin, then get the forecast for the next five days. Convert the lowest forecast temperature to Fahrenheit, then convert the highest forecast temperature to Fahrenheit. Finally, check the weather in Paris for comparison."
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
expected_final_state:
  tools_called_in_order_strict:
    - {tool: get_weather, args: {city: "Berlin"}}
    - {tool: get_forecast, args: {city: "Berlin", days: 5}}
    - {tool: convert_temperature, args: {value: 8.8, from_unit: "celsius", to_unit: "fahrenheit"}}
    - {tool: convert_temperature, args: {value: 10.8, from_unit: "celsius", to_unit: "fahrenheit"}}
    - {tool: get_weather, args: {city: "Paris"}}
  final_answer_used: true
max_steps: 10
constraints:
  - "Convert the LOWEST forecast temperature (8.8) then the HIGHEST (10.8), in that order."
