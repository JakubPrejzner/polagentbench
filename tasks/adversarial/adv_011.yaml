# Adversarial 11/13: Polish numeral parsing in tool arguments.
#
# Mid-difficulty: the user spells the day count as a Polish word
# ("pięć"). The model must normalise it to the integer 5 to satisfy the
# get_forecast schema. Common failure modes under noise: emit "5" as a
# string (schema rejects), hallucinate days=7, or pick days=3 from the
# default-day-count bias of forecast prompts.

id: adv_011
category: TOOL_SELECTION
environment: weather
language_variant: PL_EN
prompt: "Pokaż prognozę pogody dla Krakowa na najbliższe pięć dni."
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
expected_final_state:
  tool_args_exact:
    get_forecast: {city: "Kraków", days: 5}
  all_tool_calls_succeeded: true
  final_answer_used: true
max_steps: 4
constraints:
  - "Normalise the Polish numeral 'pięć' to the integer 5."
