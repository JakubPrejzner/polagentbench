# Adversarial 7/10: RECOVERY — graceful "city not found" handling.
#
# "Atlantyda" is not in the city DB; the env returns CITY_NOT_FOUND. The
# expected behaviour is one (or at most a small handful of) lookup attempts
# followed by a final_answer that informs the user the city couldn't be
# found. The failure modes this task targets:
#   - LOOP: model retries get_weather indefinitely with variant spellings.
#   - HALLUCINATED_TOOL_RESULT: model invents weather data after CITY_NOT_FOUND.
#   - RECOVERY_COLLAPSE: model never emits a final_answer.

id: adv_007
category: RECOVERY
environment: weather
language_variant: PL_EN
prompt: "Sprawdź pogodę w mieście Atlantyda."
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
expected_final_state:
  max_tool_calls: {get_weather: 2}
  final_answer_used: true
  final_answer_contains_any:
    - "nie znaleziono"
    - "nieznane"
    - "nie ma"
    - "brak"
    - "nieznana"
    - "nieznany"
    - "not found"
    - "Atlantyda"
max_steps: 5
constraints:
  - "Stop retrying after one or two failed lookups; report not-found to user."
