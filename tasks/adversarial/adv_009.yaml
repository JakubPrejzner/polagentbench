# Adversarial 9/10: STATEFUL multi-step with arithmetic + conditional alert.
#
# Two cities (Zakopane=2°C, Tatry=-5°C in the env DB), so |diff|=7 > 5
# threshold. Model must (a) call get_weather twice, (b) compute the diff,
# (c) identify Zakopane as the warmer city, (d) send a low-severity alert
# for Zakopane. Pure competence test rather than a single-tag failure
# probe — surfaces planning, arithmetic, and conditional tool use under
# the strict prompt.

id: adv_009
category: STATEFUL
environment: weather
language_variant: PL_EN
prompt: "Porównaj temperatury w Zakopanem i w Tatrach. Jeśli różnica jest większa niż 5 stopni, wyślij alarm dla cieplejszego miasta o niskiej intensywności."
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
expected_final_state:
  min_tool_calls: {get_weather: 2}
  tool_args_exact:
    send_weather_alert: {city: "Zakopane", severity: "low"}
  final_answer_used: true
max_steps: 8
constraints:
  - "Send the alert only for the warmer of the two cities."
