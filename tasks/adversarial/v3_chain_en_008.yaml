# v3 hard chain EN 008: LONG EN_EN (4 tool), conditional alert severity.
# get_weather(Vienna) -> get_forecast(Vienna,5)=[9.8,10.2,10.8,11.2,11.8] mean 10.76C -> convert
# -> send_weather_alert(Vienna, severity = low if mean<12 else medium). 10.76 < 12 -> low (deterministic).
id: v3_chain_en_008
category: STATEFUL
environment: weather
language_variant: EN_EN
prompt: "Check the weather in Vienna, then get the forecast for the next five days and convert the average of that forecast to degrees Fahrenheit. Finally, send a weather alert for Vienna: low severity if the average is below 12 degrees Celsius, otherwise medium severity."
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
expected_final_state:
  tools_called_in_order_strict:
    - {tool: get_weather, args: {city: "Vienna"}}
    - {tool: get_forecast, args: {city: "Vienna", days: 5}}
    - {tool: convert_temperature, args: {from_unit: "celsius", to_unit: "fahrenheit"}}
    - {tool: send_weather_alert, args: {city: "Vienna", severity: "low"}}
  final_answer_used: true
max_steps: 10
constraints:
  - "Send a low-severity alert because the forecast mean is below 12 C (it is: 10.76)."
