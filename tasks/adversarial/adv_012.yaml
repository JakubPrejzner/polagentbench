# Adversarial 12/13: conditional NEGATION (must NOT call alert).
#
# Wrocław is pinned to "sun" via hardcoded_state. The instruction has a
# double negation: "if NOT raining, do NOT send an alert." Common
# failure under noise: model defaults to dispatching an alert anyway
# because verbose, action-loaded tasks bias the model toward more tool
# calls. max_tool_calls: send_weather_alert=0 enforces the negation
# directly.

id: adv_012
category: STATEFUL
environment: weather
language_variant: PL_EN
hardcoded_state:
  cities:
    Wrocław: {condition: "sun"}
prompt: "Sprawdź pogodę we Wrocławiu. Jeśli NIE pada, NIE wysyłaj alarmu."
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
expected_final_state:
  tools_called_in_order_loose:
    - {tool: get_weather, args: {city: "Wrocław"}}
  max_tool_calls: {send_weather_alert: 0}
  final_answer_contains_any: ["nie pada", "słońce", "słonecznie", "nie wysłałem", "brak"]
  final_answer_used: true
max_steps: 4
constraints:
  - "Do not call send_weather_alert when no precipitation is observed."
