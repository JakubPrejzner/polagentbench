# v3 arith ladder — L3 (full 4-tool chain) / instance b (Poznań->Wrocław).
# Berlin is unreachable via the neighbour graph, so instance b reaches the
# SAME golden value through Wrocław, whose base temp (10.0 C) equals
# Berlin's: forecast(5) = [8.8,9.2,9.8,10.2,10.8] in both cities.
# Order trap: Poznań r=165 returns [Wrocław,Bydgoszcz,Zielona Góra] in
# graph order; Wrocław 165 km is FIRST though Bydgoszcz 130 km is nearer.
# Golden: mean = 9.76 C -> 49.57 F. Identical golden to L0_b / L1_b / L2_b.
id: v3_arith_L3_b
category: STATEFUL
environment: weather
language_variant: PL_EN
prompt: "Sprawdź pogodę w Poznaniu. Następnie znajdź miasta w promieniu stu sześćdziesięciu pięciu kilometrów od Poznania i dla pierwszego miasta z otrzymanej listy pobierz prognozę na pięć dni. Na koniec podaj średnią temperaturę z tej prognozy w stopniach Fahrenheita."
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
expected_final_state:
  tools_called_in_order_strict:
    - {tool: get_weather, args: {city: "Poznań"}}
    - {tool: find_nearest_city, args: {reference_city: "Poznań", max_distance_km: 165}}
    - {tool: get_forecast, args: {city: "Wrocław", days: 5}}
    - {tool: convert_temperature, args: {from_unit: "celsius", to_unit: "fahrenheit"}}
  final_answer_contains_any: ["49.57", "49,57"]
  final_answer_used: true
max_steps: 8
constraints:
  - "Normalise Polish numerals: 'stu sześćdziesięciu pięciu' to 165, 'pięć' to 5."
  - "Use the FIRST city returned by find_nearest_city, not the nearest by distance."
