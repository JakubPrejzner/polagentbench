# Adversarial 8/10: LOOP detection — ambiguous condition mapping.
#
# Warszawa is hardcoded to condition="fog". The task asks the model to send
# a low-severity alert "if it's foggy". The trap: a model that doesn't map
# the Polish "mglisto" / English "fog" symbol to the trigger may keep
# calling get_weather (looping) instead of either sending the alert or
# emitting a final_answer that explains the situation. max_tool_calls
# converts the loop into a hard fail tagged 'loop'.

id: adv_008
category: STATEFUL
environment: weather
language_variant: PL_EN
prompt: "Sprawdź pogodę w Warszawie i jeśli jest mglisto, wyślij alarm o niskiej intensywności."
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
hardcoded_state:
  cities:
    Warszawa: {condition: "fog"}
expected_final_state:
  any_tool_called: get_weather
  max_tool_calls: {get_weather: 2}
  tool_args_exact:
    send_weather_alert: {city: "Warszawa", severity: "low"}
  final_answer_used: true
max_steps: 5
constraints:
  - "Recognise fog as the trigger and send exactly one alert."
