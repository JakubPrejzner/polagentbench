# v3 hard chain EN 009: LONG EN_EN (5 tool). Oslo forecast7 day1/day7 convert + Helsinki.
# get_weather(Oslo) -> get_forecast(Oslo,7)=[2.2,2.8,3.2,3.8,4.2,4.8,5.2]
# -> convert day1 (2.2->35.96F) -> convert day7 (5.2->41.36F) -> get_weather(Helsinki).
id: v3_chain_en_009
category: STATEFUL
environment: weather
language_variant: EN_EN
prompt: "Check the weather in Oslo, then get the forecast for the next seven days. Convert the first day's temperature to Fahrenheit, then convert the seventh day's temperature to Fahrenheit. Finally, check the weather in Helsinki."
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
expected_final_state:
  tools_called_in_order_strict:
    - {tool: get_weather, args: {city: "Oslo"}}
    - {tool: get_forecast, args: {city: "Oslo", days: 7}}
    - {tool: convert_temperature, args: {value: 2.2, from_unit: "celsius", to_unit: "fahrenheit"}}
    - {tool: convert_temperature, args: {value: 5.2, from_unit: "celsius", to_unit: "fahrenheit"}}
    - {tool: get_weather, args: {city: "Helsinki"}}
  final_answer_used: true
max_steps: 10
constraints:
  - "Convert the FIRST forecast day (2.2) then the SEVENTH day (5.2), in that order."
