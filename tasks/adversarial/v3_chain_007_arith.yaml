# v3 hard chain 007 (arith): copy of v3_chain_007 + numeric final_answer_contains_any.
# Rounding-robust day2/day4 redesign (2026-06-18): was forecast4 full mean 8.25C
# -> 46.85F, a precision MINE (round(8.25,1)=8.2 -> 46.76 != 46.85). Now mean(day2,day4)
# = Płock base 8.5C exactly -> 47.3F, robust to 1-dp rounding (days stays 4).
# Golden: Warszawa(110) -> first=Płock -> forecast4 -> mean(day2=8.0,day4=9.0)=8.5C -> 47.3F.
id: v3_chain_007_arith
category: STATEFUL
environment: weather
language_variant: PL_EN
prompt: "Sprawdź pogodę w Warszawie. Następnie znajdź miasta w promieniu stu dziesięciu kilometrów od Warszawy i dla pierwszego miasta z otrzymanej listy pobierz prognozę na cztery dni. Na koniec podaj średnią temperaturę z drugiego i czwartego dnia tej prognozy w stopniach Fahrenheita."
available_tools:
  - name: get_weather
    description: "Get current weather for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
      required: [city]
  - name: get_forecast
    description: "Get a multi-day forecast for a city."
    parameters:
      type: object
      properties:
        city: {type: string}
        days: {type: integer, minimum: 1, maximum: 7}
      required: [city, days]
  - name: send_weather_alert
    description: "Send a weather alert with a severity level."
    parameters:
      type: object
      properties:
        city: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        message: {type: string}
      required: [city, severity, message]
  - name: convert_temperature
    description: "Convert a temperature between Celsius and Fahrenheit."
    parameters:
      type: object
      properties:
        value: {type: number}
        from_unit: {type: string, enum: [celsius, fahrenheit]}
        to_unit: {type: string, enum: [celsius, fahrenheit]}
      required: [value, from_unit, to_unit]
  - name: find_nearest_city
    description: "List known cities within a radius of a reference city."
    parameters:
      type: object
      properties:
        reference_city: {type: string}
        max_distance_km: {type: integer, minimum: 1}
      required: [reference_city, max_distance_km]
initial_state_path: states/empty.json
expected_final_state:
  tools_called_in_order_strict:
    - {tool: get_weather, args: {city: "Warszawa"}}
    - {tool: find_nearest_city, args: {reference_city: "Warszawa", max_distance_km: 110}}
    - {tool: get_forecast, args: {city: "Płock", days: 4}}
    - {tool: convert_temperature, args: {from_unit: "celsius", to_unit: "fahrenheit"}}
  final_answer_contains_any: ["47.3", "47,3"]
  final_answer_used: true
max_steps: 8
constraints:
  - "Normalise Polish numerals: 'stu dziesięciu' to 110, 'cztery' to 4."
  - "Use the FIRST city returned by find_nearest_city, not the nearest by distance."
  - "Average the 2nd and 4th forecast day; golden is rounding-robust (mean = 8.5C exactly)."
